<div attr="data.main.attributes"
     ko-style="data.main.style"
     class="pagebuilder-content-type webjump-caixao"
     css="data.main.css"
     event="{ mouseover: onMouseOver, mouseout: onMouseOut }, mouseoverBubble: false">

    <render args="getOptions().template"></render>

    <div class="webjump-caixao__image">
        <img if="data.image.attributes().src"
             attr="data.image.attributes"/>
    </div>

    <div class="webjump-caixao__content">
        <h3 class="webjump-caixao__title"
            attr="data.title.attributes"
            html="data.title.html"></h3>

        <p class="webjump-caixao__text"
           attr="data.text.attributes"
           html="data.text.html"></p>

        <a class="webjump-caixao__link"
           attr="data.link.attributes">
            Ver oferta
        </a>
    </div>
</div>
